# Baseline of conformance scenarios that fail on purpose. CI turns red only
# on a *new* failure or a stale entry (a listed scenario that now passes).
# See guides/protocol_versions.md for the reasoning behind each entry.
server:
  # Sake does not implement server-initiated sampling
  # (`sampling/createMessage`; see guides/protocol_versions.md), so the
  # development server has no `test_sampling` tool and the scenario fails
  # with "Unknown tool".
  - tools-call-sampling

client:
  # The client does not resume a dropped SSE stream (see
  # guides/protocol_versions.md); it has no reconnection logic to send the
  # GET request this scenario looks for.
  - sse-retry
  # The fixture server sends its `elicitation/create` request unrelated to
  # the tool call, so it can only travel on a standalone GET stream; the
  # client never opens one (see guides/protocol_versions.md), so the
  # request never arrives and the tool call never completes.
  - elicitation-sep1034-client-defaults
