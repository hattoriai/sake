name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Erlang and Elixir exactly as in .tool-versions.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # All environments: credo and the tests run in :test, ex_doc and
      # dialyxir in :dev.
      - run: mix deps.get

      - run: mix format --check-formatted

      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - run: mix credo --strict
        env:
          MIX_ENV: test

      - run: mix docs
        env:
          MIX_ENV: dev

      - run: mix test
        env:
          MIX_ENV: test
          DATABASE_URL: "ecto://postgres:postgres@localhost/sake_test"

      - run: mix dialyzer
        env:
          MIX_ENV: dev

  # The older Elixirs the test job does not cover: the lowest that mix.exs
  # accepts (~> 1.18, for the built-in JSON module), so that the floor
  # stays true, and 1.19. Format, credo, docs and dialyzer run only in the
  # test job. OTP 27.2.2, not 27.2: before it, public_key refused a CA
  # certificate with the serverAuth extended key usage, as in the chain
  # of builds.hex.pm, so setup-beam could not install Rebar or Hex. Each
  # entry's `check` is its job's name, so the 1.18 run keeps the name
  # `floor` that branch protection may require.
  floor:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - check: floor
            elixir: "1.18.3"
            otp: "27.2.2"
          - check: elixir-1.19
            elixir: "1.19.5"
            otp: "28.5"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sake_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-floor-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-floor-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - run: mix test
        env:
          MIX_ENV: test
          DATABASE_URL: "ecto://postgres:postgres@localhost/sake_test"

  # A host with none of the optional dependencies (no Phoenix, no Ecto,
  # no PubSub): Sake must compile there without a single warning.
  consumer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Generate a minimal host
        run: |
          mkdir -p _consumer
          cd _consumer
          mix new app
          cat > app/mix.exs <<'EOF'
          defmodule App.MixProject do
            use Mix.Project

            def project do
              [app: :app, version: "0.1.0", elixir: "~> 1.18", deps: [{:sake, path: "../.."}]]
            end

            def application, do: [extra_applications: [:logger]]
          end
          EOF

      - name: Compile Sake and the host with warnings as errors
        working-directory: _consumer/app
        run: |
          mix deps.get
          mix deps.compile
          mix deps.compile sake --force 2>&1 | tee sake.log
          if grep -q "warning:" sake.log; then exit 1; fi
          mix compile --warnings-as-errors

  conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Erlang and Elixir exactly as in .tool-versions.
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: conformance/package-lock.json

      - run: mix deps.get

      # `test.conformance` runs `dev.exs` (the development server), which
      # needs the `:dev` environment, not `:test`. The core run covers the
      # server and client scenarios of 2025-06-18, 2025-11-25 and
      # 2026-07-28 and the authorization-server scenarios.
      - name: Conformance (core)
        run: mix test.conformance
        env:
          MIX_ENV: dev

      # The extension scenarios (tasks, skills, the auth extensions)
      # against their own baseline, conformance/expected-failures-extensions.yaml.
      # It runs even when the core run failed, so both results show.
      - name: Conformance (extensions)
        if: success() || failure()
        run: mix test.conformance extensions
        env:
          MIX_ENV: dev
