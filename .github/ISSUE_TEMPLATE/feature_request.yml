name: Feature request
description: An idea, or a change to what Sake does.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A change of behaviour or a new feature is agreed here before a pull request (see CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, for whom, and what stops you today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: How it would look to an app (an option, a callback, a macro, a guide) and to an MCP client. Say if it changes what Sake does today.
    validations:
      required: true

  - type: input
    id: spec
    attributes:
      label: Specification
      description: The MCP revision, extension, SEP or RFC it follows, if any.
      placeholder: "MCP 2026-07-28, RFC 9449"

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Other designs, and what you do today instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues.
          required: true
        - label: I would like to make the pull request myself.
